name: Rawr X14U build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Explicit packages: the action's default list still names the removed
      # 'tools' package. Versions pinned in app/build.gradle.kts.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - uses: gradle/actions/setup-gradle@v6

      # Native compile cache: only changed C++ files rebuild between runs.
      # X14U Pano merge: the slim OpenCV build (stitching) is made once and kept here.
      - uses: actions/cache@v4
        with:
          path: build/opencv/4.10.0-arm64-v8a
          key: x14u-opencv-4.10.0-arm64-v8a-v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: x14u-native
          max-size: 600M

      # Robolectric fetches its Android jars on first use; a network blip there gets one retry.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest || ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: rawr-x14u-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Merges to main republish the `debug` prerelease so its download link
      # stays stable. PRs only keep the run artifact.
      - name: Publish debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rawr-x14u.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug rawr-x14u.apk --prerelease --target "$GITHUB_SHA" \
            --title "Rawr X14U" \
            --notes "Rawr X14U build of ${GITHUB_SHA::8}. Installs alongside Rawr and Rawr Debug."

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
