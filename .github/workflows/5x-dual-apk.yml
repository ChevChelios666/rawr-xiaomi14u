name: X14U 5x Single FullRes Lab APK

on:
  push:
    branches:
      - lab/5x-fullres-single-stream-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x14u-5x-single-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v4
        with:
          path: build/opencv/4.10.0-arm64-v8a
          key: x14u-opencv-4.10.0-arm64-v8a-v1

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: x14u-native
          max-size: 600M

      # The usual test-gated workflow remains unchanged on main.
      # This isolated experiment packages code without requiring network-dependent
      # Robolectric Android jars. A successful APK is NOT a unit-test pass.
      - name: Verify lab-only package config
        run: grep -F 'applicationIdSuffix = ".x14u.x5single"' app/build.gradle.kts

      - name: Build APK for on-device 5x diagnostics
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rawr-x14u-x5single-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
