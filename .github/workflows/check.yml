name: X14U compile check

# Work branches only: compile Kotlin (app + unit tests) and the native code. Unit tests run in the build
# (main) only, to save Actions minutes. Never publishes an APK.
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6
      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: gradle/actions/setup-gradle@v6
      # Native compile cache: only changed C++ files rebuild between runs.
      # X14U Pano merge: the slim OpenCV build (stitching) is made once and kept here.
      - uses: actions/cache@v4
        with:
          path: build/opencv/4.10.0-arm64-v8a
          key: x14u-opencv-4.10.0-arm64-v8a-v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: x14u-native
          max-size: 600M
      - name: Compile app and unit tests (Kotlin)
        run: ./gradlew :app:compileDebugUnitTestKotlin --continue 2>&1 | tee compile.log; exit ${PIPESTATUS[0]}
      - name: Compile native code (C++)
        if: success()
        run: ./gradlew :app:externalNativeBuildDebug 2>&1 | tee native.log | grep -E "error:|FAILED|BUILD" ; exit ${PIPESTATUS[0]}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            compile.log
            native.log
          retention-days: 3
