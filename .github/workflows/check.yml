name: X14U compile check

# Work branches only: compile Kotlin (app + unit tests) and run the given tests.
# Never publishes an APK.
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and unit tests (Kotlin)
        run: ./gradlew :app:compileDebugUnitTestKotlin --continue 2>&1 | tee compile.log; exit ${PIPESTATUS[0]}
      - name: Unit tests
        if: success()
        run: ./gradlew :app:testDebugUnitTest --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            compile.log
            app/build/reports/tests/
          retention-days: 3
